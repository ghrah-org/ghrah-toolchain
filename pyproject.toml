[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghrah-toolchain"
version = "0.2.0"
description = "ghrah 开发、分发、配置与实例管理工具链"
readme = "README.md"
requires-python = ">=3.15.1"
# 工具链允许显式声明第三方依赖，但保持与 ghrah 运行时业务包解耦。
dependencies = ["jsonschema>=4.26", "packaging>=26.3", "psutil>=7.2"]

[project.scripts]
ghrah = "ghrah_toolchain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ghrah_toolchain = ["schemas/*.json"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: 真实 uv sync / pnpm install 集成验证（默认跳过）",
]

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
