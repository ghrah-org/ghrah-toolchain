[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghrah-bootloader"
version = "0.1.0"
description = "ghrah AgentOS 安装/配置工具与引导器"
readme = "README.md"
requires-python = ">=3.11"
# boot 路径硬约束：仅 stdlib，禁止任何运行时第三方依赖与 ghrah-* 依赖
dependencies = []

[project.scripts]
ghrah-bootloader = "ghrah_bootloader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
